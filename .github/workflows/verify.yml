name: Verify
on:
  push:
    branches: [master, 'feat/beyond-fluency-reviewed']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install pinned development host
        run: npm install --ignore-scripts --no-save --package-lock=false @earendil-works/pi-coding-agent@0.85.1 @earendil-works/pi-ai@0.85.1 @earendil-works/pi-tui@0.85.1 typebox@1.3.27 typescript@5.9.3 @types/node@22.19.19
      - name: Check extension syntax
        run: find extensions -name '*.ts' -print0 | xargs -0 -n 1 node --experimental-strip-types --check
      - name: Run regression tests
        run: node --experimental-strip-types --test tests/*.test.ts
      - name: Archive source snapshot for review
        if: always()
        run: git archive --format=tar HEAD > source-snapshot.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-snapshot
          path: source-snapshot.tar
          retention-days: 7
