name: Verify
on:
  push:
    branches: [master, 'feat/beyond-fluency-completion', 'feat/beyond-fluency-reviewed']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install pinned development host
        run: npm ci --ignore-scripts
      - name: Syntax, types, schema exports, and regression suite
        run: npm run check
      - name: Check distributable contents
        run: npm run pack:check
      - name: Archive checked source
        if: always()
        run: git archive --format=tar HEAD --output=source-snapshot.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-snapshot-${{ matrix.os }}
          path: source-snapshot.tar
          retention-days: 7
